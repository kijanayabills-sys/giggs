<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIGGS | Registered Accounts</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #f4f7fc; color: #26344d; font: 16px/1.6 Arial, sans-serif; }
    main { max-width: 1050px; margin: 0 auto; }
    h1, h2, h3 { color: #101d3a; }
    .panel, .account { background: white; border: 1px solid #e3e9f3; border-radius: 12px; padding: 20px; margin: 16px 0; }
    .account h3 { margin-top: 0; }
    .account p { overflow-wrap: anywhere; margin: 6px 0; }
    input { width: 100%; padding: 12px; border: 1px solid #ccd5e4; border-radius: 8px; font-size: 16px; }
    button, .button { display: inline-block; border: 0; border-radius: 8px; padding: 11px 16px; background: #2563eb; color: white; cursor: pointer; text-decoration: none; font-weight: bold; }
    .secondary { background: #eaf0ff; color: #18336b; }
    .error { color: #b42318; }
    .small { color: #68758a; font-size: 13px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Registered Accounts</h1>
    <p><a class="button secondary" href="./">Back to GIGGS</a></p>

    <section id="status" class="panel" aria-live="polite">Checking your account…</section>

    <section id="accountsPanel" class="panel" hidden>
      <h2>Account profiles</h2>
      <label for="accountSearch">Search by name, email, phone, or account ID</label>
      <input id="accountSearch" type="search" placeholder="Search registered accounts">
      <p id="accountCount" class="small"></p>
      <div id="accountsList" aria-live="polite"></div>
      <p class="small">Only profile fields available in the GIGGS profiles table are shown. Passwords and authentication secrets are never displayed.</p>
    </section>
  </main>

  <script>
    "use strict";

    const SUPABASE_URL = "https://fvmqjqjojfbeiiltauxm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ugLuC8Q3J6-mh5rSqqrD0Q_-GoHc3yS";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const statusNode = document.getElementById("status");
    const accountsPanel = document.getElementById("accountsPanel");
    const accountsList = document.getElementById("accountsList");
    const accountCount = document.getElementById("accountCount");
    const accountSearch = document.getElementById("accountSearch");
    let accounts = [];

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[char]);
    }

    function renderAccounts() {
      const query = accountSearch.value.trim().toLowerCase();
      const filtered = accounts.filter(account =>
        [account.full_name, account.email, account.phone, account.id]
          .some(value => String(value ?? "").toLowerCase().includes(query))
      );

      accountCount.textContent = `${filtered.length} of ${accounts.length} registered account(s)`;
      accountsList.innerHTML = filtered.length ? filtered.map(account => `
        <article class="account">
          <h3>${escapeHTML(account.full_name || "Name not provided")}</h3>
          <p><strong>Email:</strong> ${escapeHTML(account.email || "Not provided")}</p>
          <p><strong>Phone:</strong> ${escapeHTML(account.phone || "Not provided")}</p>
          <p><strong>Account ID:</strong> ${escapeHTML(account.id)}</p>
          <p><strong>Role:</strong> ${escapeHTML(account.role || "user")}</p>
          <p><strong>Verification:</strong> ${escapeHTML(account.verification_status || (account.is_verified ? "verified" : "unverified"))}</p>
          <p><strong>Verified:</strong> ${account.is_verified ? "Yes" : "No"}</p>
          <p><strong>Referral code:</strong> ${escapeHTML(account.referral_code || "Not assigned")}</p>
        </article>
      `).join("") : "<p>No matching registered accounts.</p>";
    }

    async function initializeAccountsPage() {
      if (!window.supabase) {
        statusNode.textContent = "Supabase could not be loaded. Refresh and try again.";
        return;
      }

      const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
      if (sessionError || !sessionData.session) {
        statusNode.innerHTML = 'Please <a href="./">sign in to GIGGS</a> with an administrator account first.';
        return;
      }

      const user = sessionData.session.user;
      const { data: profile, error: profileError } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .maybeSingle();

      if (profileError || String(profile?.role || "").trim().toLowerCase() !== "admin") {
        statusNode.textContent = "Administrator access only. Your account was not authorized to view registered profiles.";
        return;
      }

      statusNode.textContent = "Loading registered accounts…";
      const { data, error } = await supabaseClient
        .from("profiles")
        .select("id,full_name,email,phone,role,is_verified,verification_status,referral_code")
        .order("full_name", { ascending: true });

      if (error) {
        statusNode.innerHTML = `<span class="error">Could not load profiles: ${escapeHTML(error.message)}. Confirm that Supabase Row Level Security allows admins to read profiles.</span>`;
        return;
      }

      accounts = data || [];
      statusNode.textContent = "Administrator access confirmed.";
      accountsPanel.hidden = false;
      renderAccounts();
    }

    accountSearch.addEventListener("input", renderAccounts);
    initializeAccountsPage().catch(error => {
      statusNode.textContent = `Unable to load registered accounts: ${error.message}`;
    });
  </script>
</body>
</html>
